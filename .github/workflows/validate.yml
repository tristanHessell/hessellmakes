name: Validate

on:
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tests run in a real headless Chromium via Playwright, not jsdom —
      # see CLAUDE.md.
      - run: npx playwright install --with-deps chromium

      # Runs lint, lint:css, lint:md, lint:package-json, format:check, spellcheck, the
      # test suite, and a production build - the same command used locally
      # before considering work done. The build step fails this check on a
      # type error the test suite does not catch.
      - run: npm run validate
