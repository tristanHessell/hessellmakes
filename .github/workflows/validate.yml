name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tests run in a real headless Chromium via Playwright, not jsdom —
      # see CLAUDE.md.
      - run: npx playwright install --with-deps chromium

      # Runs lint, lint:css, format:check, spellcheck, and the test suite —
      # the same command used locally before considering work done.
      - run: npm run validate

      # Builds the static bundle into dist/, for the deploy step below. This
      # repeats the build npm run validate's tsc step already checked, but
      # npm run validate does not run vite build itself — see CLAUDE.md.
      - name: Build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run build

      # This job uploads dist/ straight to Netlify, through the Netlify CLI,
      # instead of a Netlify build hook. A build hook needs Netlify's own
      # "Builds" feature active, and that feature auto-builds on every push
      # too, which deploys a commit twice and defeats the point of gating on
      # this job. Pushing a pre-built dist/ needs no build on Netlify's side
      # at all, so the repository's Netlify integration can stay fully
      # unlinked from automatic deploys — see CLAUDE.md. The site ID below is
      # not a secret — it is the same ID already public in this repo's
      # README badge URL. Requires the repo secret NETLIFY_AUTH_TOKEN, a
      # personal access token from Netlify's User settings → Applications.
      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN secret not set yet — skipping deploy."
            exit 0
          fi
          npx --yes netlify-cli@27.12.0 deploy --prod --dir=dist --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: d24a906a-cdd5-4b4a-b9b7-899eef1d9451
